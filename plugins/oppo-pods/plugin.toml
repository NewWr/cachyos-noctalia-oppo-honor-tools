# OPPO Pods for Noctalia
# Controls OPPO, OnePlus, and realme Bluetooth earbuds (battery, ANC modes).
# Author: osp54

id = "osp54/oppo-pods"
name = "OPPO Pods"
version = "1.1.2"
plugin_api = 24
author = "osp54"
license = "MIT"
icon = "headphones"
description = "Battery and listening controls, with verified Free4 ANC levels, EQ and device settings."
tags = ["audio", "bar", "panel", "service", "hardware", "indicator"]
dependencies = ["python3"]

[[setting]]
key = "device_mac"
type = "string"
label_key = "settings.device_mac.label"
description_key = "settings.device_mac.description"
default = ""

[[setting]]
key = "low_battery_notifications"
type = "bool"
label_key = "settings.low_battery_notifications.label"
description_key = "settings.low_battery_notifications.description"
default = true

[[setting]]
key = "pause_on_remove"
type = "bool"
label_key = "settings.pause_on_remove.label"
description_key = "settings.pause_on_remove.description"
default = true

[[widget]]
id = "oppo-pods"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle osp54/oppo-pods:panel"
  right = "plugin osp54/oppo-pods:service all cycle-noise"

  [[widget.setting]]
  key = "hide_when_disconnected"
  type = "bool"
  label_key = "settings.hide_when_disconnected.label"
  description_key = "settings.hide_when_disconnected.description"
  default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 500
height = 650
placement = "floating"
position = "top_center"
open_near_click = false

[[service]]
id = "service"
entry = "service.luau"
